version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: glowminder-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: glowminder_casptone
    volumes:
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # AI Engine (Python FastAPI)
  ai-engine:
    build:
      context: ./glowminder-ai-engine
      dockerfile: Dockerfile
    container_name: glowminder-ai-engine
    ports:
      - "7860:7860"
    environment:
      - TF_ENABLE_ONEDNN_OPTS=0
    depends_on:
      - db

  # Backend (Node.js Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: glowminder-backend
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=glowminder_casptone
      - AI_ENGINE_URL=http://ai-engine:7860
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
      ai-engine:
        condition: service_started
    volumes:
      - ./backend/src:/app/src

  # Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: glowminder-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
